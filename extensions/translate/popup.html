<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #070d18;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
    .badge { font-size: 10px; background: #1e293b; color: #38bdf8; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; }
    select { background: #0f172a; color: #38bdf8; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; outline: none; }
    .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 14px; border: none; cursor: pointer; }
    .btn:hover { filter: brightness(1.1); }
    .footer { font-size: 10px; color: #64748b; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>TOOLTIP TRANSLATE</h1>
    <span class="badge">v1.0.1</span>
  </div>
  <div class="setting-row">
    <span>Idioma Objetivo:</span>
    <select id="targetLang">
      <option value="es" selected>Español (ES)</option>
      <option value="en">Inglés (EN)</option>
      <option value="ja">Japonés (JA)</option>
      <option value="fr">Francés (FR)</option>
      <option value="de">Alemán (DE)</option>
    </select>
  </div>
  <div class="setting-row">
    <span>Lente Flotante en Selección:</span>
    <input type="checkbox" id="autoLens" checked>
  </div>
  <button class="btn" id="btnTest">Probar Traducción de Muestra</button>
  <div class="footer">Ecosistema ToolTip AI · dixi3stdgdl-design</div>
</body>
</html>
