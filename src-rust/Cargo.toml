[package]
name = "teachme_core"
version = "0.1.0"
edition = "2021"
description = "Native Rust Kernel & Low-Level Windows 11 Hook Engine for TeachMe AI"

[lib]
name = "teachme_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }
