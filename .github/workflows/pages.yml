name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create site directory
        run: |
          mkdir -p _site
          # Páginas estáticas (GitHub Pages)
          cp index.html _site/
          cp privacy.html _site/
          cp styles.css _site/
          cp favicon.ico _site/
          cp icon.png _site/
          cp CNAME _site/
          cp .nojekyll _site/
          cp LICENSE _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          # i18n
          cp -r en _site/
          cp -r de _site/
          cp -r privacy _site/
          # reportes públicos (opcional)
          mkdir -p _site/docs/reports
          cp -r docs/reports/* _site/docs/reports/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
