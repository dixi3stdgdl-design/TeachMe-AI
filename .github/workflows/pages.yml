name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create site directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp privacy.html _site/
          cp styles.css _site/
          cp app.js _site/
          cp favicon.ico _site/
          cp app.ico _site/
          cp icon.png _site/
          cp CNAME _site/
          cp .nojekyll _site/
          cp README.md _site/
          cp LICENSE _site/
          cp -r privacy _site/ 2>/dev/null || true
          cp -r translate _site/ 2>/dev/null || true
          cp -r aura _site/ 2>/dev/null || true
          cp -r voice _site/ 2>/dev/null || true
          cp -r downloads _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
